<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast - Your Weather, Your Way</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #4b3f72, #6a5acd);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffd700;
        }
        p {
            margin-bottom: 30px;
        }
        .search-box {
            margin-bottom: 30px;
        }
        input {
            padding: 10px;
            width: 250px;
            border: none;
            border-radius: 5px;
            outline: none;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            background-color: #ffd700;
            color: #333;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background-color: #ffea00;
        }
        #result {
            margin-top: 20px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>SkyCast</h1>
        <p>Search any city in the world and get real-time weather updates instantly.</p>
        
        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g. Lahore)">
            <button onclick="getWeather()">Get Weather</button>
        </div>

        <div id="result">
            <h2 id="temp">--°C</h2>
            <h3 id="cityName">City Name</h3>
            <p id="description"></p>
        </div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById('cityInput').value;
            const tempElement = document.getElementById('temp');
            const cityElement = document.getElementById('cityName');
            const descElement = document.getElementById('description');

            if (!city) {
                alert("Please enter a city name!");
                return;
            }

            try {
                // This is the exact live link to your server
                const response = await fetch(`https://weather-app-acm-f134.vercel.app/api/weather?city=${city}`);
                const data = await response.json();

                if (data.error) {
                    alert("City not found. Please try again.");
                } else {
                    tempElement.innerText = Math.round(data.main.temp) + "°C";
                    cityElement.innerText = data.name;
                    descElement.innerText = data.weather[0].description;
                }
            } catch (error) {
                alert("Something went wrong! Please try again later.");
            }
        }
    </script>
</body>
</html>
