<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast | Modern Weather</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <!-- Navigation -->
    <nav>
        <div class="logo">☁️ SkyCast</div>
        <ul>
            <li><a href="/" class="active">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Hero Section -->
    <main class="container">
        <h1 class="headline">Weather, <span>Beautifully</span> Forecasted</h1>
        
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Search for a city...">
            <button onclick="getWeather()">Get Weather</button>
        </div>

        <!-- Weather Card -->
        <div class="weather-card" id="weather-card" style="display: none;">
            <h2 id="city-name">City</h2>
            <div class="temperature" id="temp">--°C</div>
            <p id="description">Clear Sky</p>
            <div class="details">
                <p>Humidity: <span id="humidity">--%</span></p>
                <p>Wind: <span id="wind">-- km/h</span></p>
            </div>
        </div>
    </main>

    <script src="/js/main.js"></script>
</body>
</html>
