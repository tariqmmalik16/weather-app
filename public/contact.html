<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | SkyCast</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav>
        <div class="logo">☁️ SkyCast</div>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/contact" class="active">Contact</a></li>
        </ul>
    </nav>
    <main class="container">
        <div class="weather-card">
            <h1>Contact Us</h1>
            <p style="margin-top: 20px;">We would love to hear from you!</p>
            
            <!-- Simple Contact Form -->
            <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
                <input type="text" placeholder="Your Name" style="border: 1px solid white; border-radius: 5px;">
                <input type="email" placeholder="Your Email" style="border: 1px solid white; border-radius: 5px;">
                <textarea placeholder="Your Message" rows="4" style="border: 1px solid white; border-radius: 5px; padding: 10px;"></textarea>
                <button type="button">Send Message</button>
            </div>
        </div>
    </main>
    <script src="/js/main.js"></script>
</body>
</html>
